name: Deklar CI

on:
  push:
    branches: [main]
    paths: ["apps/deklar/**", ".github/workflows/deklar-ci.yml"]
  pull_request:
    branches: [main]
    paths: ["apps/deklar/**", ".github/workflows/deklar-ci.yml"]

defaults:
  run:
    working-directory: apps/deklar

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/deklar/package-lock.json

      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

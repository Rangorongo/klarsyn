name: Tullsyn CI

on:
  push:
    branches: [main]
    paths: ["apps/tullsyn/**", ".github/workflows/tullsyn-ci.yml"]
  pull_request:
    branches: [main]
    paths: ["apps/tullsyn/**", ".github/workflows/tullsyn-ci.yml"]

defaults:
  run:
    working-directory: apps/tullsyn

jobs:
  pytest:
    # windows-latest: PDF-testerna behöver Arial-fonterna som finns där.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Installera beroenden
        run: pip install -r requirements.txt

      - name: Kör testsviten
        run: pytest -v
